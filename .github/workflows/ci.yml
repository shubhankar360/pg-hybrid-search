name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pglite:
    name: tests · PGlite (in-process Postgres)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test

  postgres:
    name: tests · real Postgres + pgvector
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: search }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Same suite, same SQL, different engine: proves the queries are portable.
      - run: npm test

  docker:
    name: image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf -X POST localhost:8080/docs -d '[{"id":"1","title":"Postgres","body":"full-text search with tsvector"},{"id":"2","title":"pgvector","body":"approximate nearest neighbours with HNSW"}]'
          curl -sf 'localhost:8080/search?q=nearest+neighbours&mode=hybrid' | tee /tmp/r.json
          grep -q '"id":"2"' /tmp/r.json
      - if: always()
        run: docker compose logs api | tail -50
